name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      ts_vitest: ${{ steps.filter.outputs.ts_vitest }}
      rust_test: ${{ steps.filter.outputs.rust_test }}
      e2e_test: ${{ steps.filter.outputs.e2e_test }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ts_vitest:
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - 'components.json'
              - 'vite.config.ts'
              - 'tailwind.config.ts'
              - 'postcss.config.js'
              - 'index.html'
            rust_test:
              - 'src-tauri/**/*.rs'
              - 'src-tauri/Cargo.toml'
              - 'src-tauri/Cargo.lock'
              - 'src-tauri/tauri.conf.json'
            e2e_test:
              - 'e2e/**'
              - 'playwright.config.ts'

  ts-lint:
    name: TS Lint
    needs: filter
    if: needs.filter.outputs.ts_vitest == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run TS Lint
        run: npm run lint

  ts-type-check:
    name: TS Type Check
    needs: filter
    if: needs.filter.outputs.ts_vitest == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run TS Type Check
        run: npm run type-check

  ts-vitest:
    name: TS Vitest
    needs: filter
    if: needs.filter.outputs.ts_vitest == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run TS Vitest
        run: npm test

  rust-test:
    name: Rust Test
    needs: filter
    if: needs.filter.outputs.rust_test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
      - name: install dependencies (ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Run Rust Test
        run: cargo test
        working-directory: src-tauri

  e2e-test:
    name: E2E Test
    needs: filter
    if: needs.filter.outputs.ts_vitest == 'true' || needs.filter.outputs.rust_test == 'true' || needs.filter.outputs.e2e_test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps
      - name: Run E2E Tests
        run: npm run e2e:ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
